---
- name: Mettre à jour le cache APT
  apt:
    update_cache: yes

- name: Installer Apache2
  apt:
    name: apache2
    state: present

- name: Démarrer et activer Apache
  service:
    name: apache2
    state: started
    enabled: true

- name: Déployer la page d'accueil
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"
  notify: Restart Apache
